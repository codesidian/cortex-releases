# Tamper alarm. Re-verifies the latest release against the pinned release key
# whenever releases or installers change, and daily. A red run means something
# in this repository no longer matches what the offline key signed; GitHub
# emails the repository owner when it fails.
name: verify

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installers pin the keys in minisign.pub and minisign-next.pub and share a floor
        run: |
          set -euo pipefail
          for f in minisign.pub minisign-next.pub; do
            key="$(sed -n 2p "$f")"
            grep -qF "$key" <(grep '^RELEASE_PUBKEYS=' install.sh)
            grep -qF "\"$key\"" <(sed -n '/^\$ReleasePubkeys = @(/,/^)/p' install.ps1)
          done
          sh_floor="$(sed -nE 's/^MIN_VERSION="([^"]*)"$/\1/p' install.sh)"
          ps_floor="$(sed -nE 's/^\$MinVersion = "([^"]*)"$/\1/p' install.ps1)"
          [ -n "$sh_floor" ] && [ "$sh_floor" = "$ps_floor" ] \
            || { echo "::error::install.sh floor '$sh_floor' != install.ps1 floor '$ps_floor'"; exit 1; }

      - name: Latest release verifies against the pinned key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(sed -n '/^RELEASE_PUBKEYS=/p; /^MIN_VERSION=/p; /^minisign_verify(){/,/^}/p' install.sh)"
          if ! gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::no release published yet"; exit 0
          fi
          mkdir -p rel && cd rel
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*'
          minisign_verify manifest.json manifest.json.minisig
          version="$(jq -er .version manifest.json)"
          expires="$(jq -r '.expires // empty' manifest.json)"
          if [ -n "$expires" ]; then
            left=$(( $(date -u -d "$expires" +%s) - $(date -u +%s) ))
            [ "$left" -gt 0 ] || { echo "manifest expired at $expires; publish a re-signed release"; exit 1; }
            [ "$left" -gt 604800 ] || echo "::warning::manifest expires $expires (under 7 days)"
          fi
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          [ "$tag" = "v$version" ] || { echo "latest tag $tag does not match signed version $version"; exit 1; }
          [ "$(printf '%s\n%s\n' "$MIN_VERSION" "$version" | sort -V | head -1)" = "$MIN_VERSION" ]
          jq -r '(.targets[], (.installers // {})[]) | [.file, (.size|tostring), .sha256] | @tsv' manifest.json |
          while IFS=$'\t' read -r file size sha; do
            [[ "$file" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$file" != *..* ]] || { echo "unsafe file name $file"; exit 1; }
            [ "$(wc -c < "$file" | tr -d ' ')" = "$size" ]
            [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$sha" ]
            echo "ok $file"
          done
          # Installers: install.sh carries its own signature, and both must pin
          # the same keys as this repository's installers.
          signed="manifest.json.minisig"
          if jq -e '.installers["install.sh"]' manifest.json >/dev/null; then
            minisign_verify install.sh install.sh.minisig
            echo "ok install.sh.minisig"
            signed="$signed install.sh.minisig"
            for f in ../minisign.pub ../minisign-next.pub; do
              key="$(sed -n 2p "$f")"
              grep -qF "$key" <(grep '^RELEASE_PUBKEYS=' install.sh)
              grep -qF "\"$key\"" <(sed -n '/^\$ReleasePubkeys = @(/,/^)/p' install.ps1)
            done
          fi
          extra="$(comm -13 <( (echo manifest.json; printf '%s\n' $signed; jq -r '.targets[].file, ((.installers // {})[].file)' manifest.json) | sort) <(ls | sort))"
          [ -z "$extra" ] || { echo "unsigned files attached to the release: $extra"; exit 1; }
