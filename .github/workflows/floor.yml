# Raises install.sh's rollback floor (MIN_VERSION) to each newly published
# release, so the installer refuses to install anything older than it. Runs
# only after the release's manifest verifies against the pinned keys: a
# release can only be published by the owner signing its draft with the
# release YubiKey (codesidian-infra/release/sign-release.py).
name: floor

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: floor
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify the release and raise MIN_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          eval "$(sed -n '/^RELEASE_PUBKEYS=/p; /^MIN_VERSION=/p; /^minisign_verify(){/,/^}/p' install.sh)"
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/rel" \
            --pattern manifest.json --pattern manifest.json.minisig
          minisign_verify "$RUNNER_TEMP/rel/manifest.json" "$RUNNER_TEMP/rel/manifest.json.minisig"
          version="$(jq -er .version "$RUNNER_TEMP/rel/manifest.json")"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match signed version $version"; exit 1; }
          if [ "$(printf '%s\n%s\n' "$MIN_VERSION" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "$MIN_VERSION" = "$version" ]; then
            echo "floor already $MIN_VERSION; nothing to do"; exit 0
          fi
          sed -i -E "s/^MIN_VERSION=\"[^\"]*\"/MIN_VERSION=\"$version\"/" install.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "install.sh: raise rollback floor to $version"
          git push origin HEAD:main
