# Raises the installers' rollback floor (install.sh MIN_VERSION, install.ps1
# $MinVersion) to each newly published release, so they refuse to install
# anything older than it. Runs only after the release's manifest verifies
# against the pinned keys: a release can only be published by the owner
# signing its draft with the release YubiKey
# (codesidian-infra/release/sign-release.py).
name: floor

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: floor
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Verify the release and raise MIN_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          eval "$(sed -n '/^RELEASE_PUBKEYS=/p; /^MIN_VERSION=/p; /^minisign_verify(){/,/^}/p' install.sh)"
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/rel" \
            --pattern manifest.json --pattern manifest.json.minisig
          minisign_verify "$RUNNER_TEMP/rel/manifest.json" "$RUNNER_TEMP/rel/manifest.json.minisig"
          version="$(jq -er .version "$RUNNER_TEMP/rel/manifest.json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad signed version $version"; exit 1; }
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match signed version $version"; exit 1; }
          if [ "$(printf '%s\n%s\n' "$MIN_VERSION" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "$MIN_VERSION" = "$version" ]; then
            echo "floor already $MIN_VERSION; nothing to do"; exit 0
          fi
          sed -i -E "s/^MIN_VERSION=\"[^\"]*\"/MIN_VERSION=\"$version\"/" install.sh
          sed -i -E "s/^\\\$MinVersion = \"[^\"]*\"/\\\$MinVersion = \"$version\"/" install.ps1
          grep -qx "MIN_VERSION=\"$version\"" install.sh && grep -qx "\\\$MinVersion = \"$version\"" install.ps1 \
            || { echo "::error::could not raise the floor in both installers"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "installers: raise rollback floor to $version"
          git push origin HEAD:main
